<div class="create-module-page">

  <header class="page-header">
    <h1>Create Module</h1>
  </header>

  <form class="module-form" [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Module Name</label>
      <input type="text" formControlName="name" placeholder="e.g. Module 5" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" rows="4" placeholder="What this module covers"></textarea>
    </div>

    <div class="form-group">
      <label>Pre-Requisite Modules</label>
      <div class="pill-group">
        @for (module of availableModules(); track module.id) {
          <button
            type="button"
            class="pill"
            [class.selected]="isSelected(module.id)"
            (click)="togglePrerequisite(module.id)"
          >
            {{ module.name }}
          </button>
        }
      </div>
    </div>

    <div class="form-group">
      <label>Skills Learnt</label>
      <input type="text" formControlName="skills_learnt" placeholder="e.g. Parallel parking" />
    </div>

    <div class="form-group">
      <label>Estimated Time Taken</label>
      <input type="text" formControlName="estimated_time" placeholder="e.g. 2 hours" />
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <div class="form-actions">
  <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="submitting()">
    Cancel
  </button>

  <button type="submit" class="btn-submit" [disabled]="submitting()">
    {{ submitting() ? 'Creating...' : 'Create Course' }}
  </button>
</div>

  </form>

</div>
