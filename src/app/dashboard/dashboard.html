<div class="dashboard-page">

  <!-- =============================== -->
  <!-- SIDEBAR -->
  <!-- =============================== -->

  <aside class="dashboard-sidebar">

    <div class="sidebar-brand">
      <div class="brand-text">
        <span class="brand-title">Training</span>
        <span class="brand-subtitle">Management System</span>
      </div>
    </div>

    <nav class="sidebar-navigation">

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <svg [lucideIcon]="houseIcon" [size]="20" class="nav-icon"></svg>
        <span>Dashboard</span>
      </a>

      <button class="nav-item">
        <svg [lucideIcon]="graduationCapIcon" [size]="20" class="nav-icon"></svg>
        <span>Trainees</span>
      </button>

      <button class="nav-item">
        <svg [lucideIcon]="usersIcon" [size]="20" class="nav-icon"></svg>
        <span>Trainers</span>
      </button>

      <a
        routerLink="/dashboard/courses"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg [lucideIcon]="bookOpenIcon" [size]="20" class="nav-icon"></svg>
        <span>Courses</span>
      </a>

      <button class="nav-item">
        <svg [lucideIcon]="calendarIcon" [size]="20" class="nav-icon"></svg>
        <span>Training</span>
      </button>

      <button class="nav-item">
        <svg [lucideIcon]="chartBarIcon" [size]="20" class="nav-icon"></svg>
        <span>Reports</span>
      </button>

    </nav>

    <div class="sidebar-footer">

      <button class="nav-item" (click)="navigateTo('/settings')">
        <svg [lucideIcon]="settingsIcon" [size]="20" class="nav-icon"></svg>
        <span>Settings</span>
      </button>

      <button class="nav-item logout-button" (click)="logout()">
        <svg [lucideIcon]="logoutIcon" [size]="20" class="nav-icon"></svg>
        <span>Logout</span>
      </button>

    </div>

  </aside>


  <!-- =============================== -->
  <!-- MAIN CONTENT -->
  <!-- =============================== -->

  <main class="dashboard-content">

    <!-- TOP BAR -->

    <header class="dashboard-header">
      <div>
        <h1>Dashboard</h1>
        <p>Welcome back, <strong>{{ currentUser() }}</strong></p>
      </div>

      <div class="header-actions">
        <button class="icon-button">
          <svg [lucideIcon]="bellIcon" [size]="20"></svg>
          <span class="notification-badge">3</span>
        </button>

        <div class="user-profile">
          <div class="user-avatar">JD</div>
          <div class="user-info">
            <span class="user-name">{{ currentUser() }}</span>
            <span class="user-role">{{ currentRole() }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- CHILD ROUTE CONTENT SWAPS HERE -->
    <router-outlet></router-outlet>

  </main>

</div>
